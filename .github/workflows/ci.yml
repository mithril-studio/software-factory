name: CI

# The floor, not the ceiling: undefined names, syntax errors, the test modules this repo already
# carries, and the repository-memory validator. It exists because an `F821` — a bare `ci_failure`
# where every sibling line says `merge_attempt.ci_failure` — reached main and would have raised
# NameError on the one path it guards, the fix run after CI goes red on an approved pull request.
#
# What runs is `scripts/verify.sh`, not a list repeated here. It used to be a list repeated here,
# and it drifted: the memory validator was added in #65 and `.factory.md` kept telling agents
# there were two gates and that those were the only ones. Two of the four issues in the #49-54
# batch failed on the gate nobody had been told to run. One file, two callers, no drift.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -e . ruff

      # One step rather than three named ones: the script prints an `== <gate>` header before
      # each, so the log still says which gate failed, and nothing here can fall out of step
      # with what an agent is told to run before opening the pull request.
      - name: Verify
        run: scripts/verify.sh
