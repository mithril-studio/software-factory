[project]
name = "software-factory"
version = "0.1.0"
description = "An agentic software factory: GitHub issues in, pull requests out, on boxd VMs."
requires-python = ">=3.11"
dependencies = [
    "boxd>=0.2.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "python-multipart>=0.0.9",
    # Acceptance criteria travel as a yaml block inside an issue body, and the control plane
    # parses them itself rather than trusting an agent to read its own contract.
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[tool.ruff]
line-length = 100

[tool.setuptools]
packages = ["control"]
